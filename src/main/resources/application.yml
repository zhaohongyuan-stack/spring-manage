spring:
  application:
    name: FrManage
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/hotel_inventory
    username: postgres
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

server:
  port: 8080
  forward-headers-strategy: framework

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    use-root-path: true
